<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tilt+Neon&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Admin | Zhigre</title>
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Zhigre home">
        <span class="brand-mark">
          <img src="images/Brain.png" alt="">
        </span>
        <span>
          <strong>Zhigre Admin</strong>
          <small>Local content tools</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Admin navigation">
        <a class="nav-link" href="index.html">Site</a>
        <a class="nav-link" href="recruiter.html">Recruiter View</a>
      </nav>
    </header>

    <main class="main-panel">
      <section class="page-hero">
        <h1>Admin</h1>
        <p>Add collection entries, update page copy, preview Markdown, and rebuild the static website.</p>
      </section>

      <section class="page-content admin-page">
        <div class="admin-tabs" role="tablist" aria-label="Admin tools">
          <button class="admin-tab is-active" type="button" data-panel="add-panel">Add Entry</button>
          <button class="admin-tab" type="button" data-panel="page-panel">Edit Page</button>
        </div>

        <section id="add-panel" class="admin-panel is-active">
          <form id="item-form" class="admin-form">
            <label>
              Collection
              <select name="collection" id="collection-select"></select>
            </label>
            <label>
              Title
              <input name="title" required placeholder="OSINT Challenge 002">
            </label>
            <label>
              Slug
              <input name="slug" placeholder="osint-challenge-002">
            </label>
            <label>
              Date
              <input name="date" type="date">
            </label>
            <label>
              Type
              <input name="type" placeholder="OSINT Writeup">
            </label>
            <label>
              Summary
              <textarea name="summary" rows="3" placeholder="Short summary shown on the card."></textarea>
            </label>
            <label>
              Source URL
              <input name="source" type="url" placeholder="https://...">
            </label>
            <label>
              Image path or URL
              <input name="image" placeholder="../media/scams/example.jpg">
            </label>
            <label class="full-width">
              Content Markdown
              <textarea name="body" rows="14" placeholder="# Heading&#10;&#10;Write Markdown here."></textarea>
            </label>
            <div class="admin-actions full-width">
              <button class="action-button" type="submit">Save Entry</button>
              <button class="action-button action-button-secondary" type="button" id="preview-item">Preview Markdown</button>
            </div>
          </form>
        </section>

        <section id="page-panel" class="admin-panel">
          <form id="page-form" class="admin-form">
            <label>
              Page
              <select name="slug" id="page-select"></select>
            </label>
            <label>
              Title
              <input name="title" required>
            </label>
            <label>
              Intro
              <input name="intro">
            </label>
            <label class="full-width">
              Page Markdown
              <textarea name="body" rows="16"></textarea>
            </label>
            <div class="admin-actions full-width">
              <button class="action-button" type="submit">Update Page</button>
              <button class="action-button action-button-secondary" type="button" id="preview-page">Preview Markdown</button>
            </div>
          </form>
        </section>

        <section class="preview-panel">
          <div class="preview-header">
            <h2>Preview</h2>
            <p id="admin-status" class="muted">Run this page through <code>npm run admin</code> so it can save files.</p>
          </div>
          <div id="markdown-preview" class="preview-content">
            <p class="muted">Markdown preview appears here.</p>
          </div>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <span>Local admin only</span>
      <span class="footer-links">
        <a href="https://github.com/Zhigre/Website" target="_blank" rel="noreferrer">Repository</a>
      </span>
    </footer>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
